<body>

<header class="site-header"></header>

<main>

  <section class="page-header">
    <div class="container">
      <p class="eyebrow reveal">Portfolio</p>
      <h1 class="section-heading reveal">Designs</h1>
      <p class="section-lede reveal">
        Identity, editorial, and interface design work. Click any piece
        to view it larger.
      </p>
    </div>
  </section>

  <section class="masonry container">

    <div class="masonry-item h2 reveal" data-lightbox-title="Marrow Rebrand" data-lightbox-desc="Full identity redesign for a Portland design studio — logotype, color system, and stationery.">
      <div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg></div>
    </div>

    <div class="masonry-item h4 reveal" data-lightbox-title="Field Guide Zine" data-lightbox-desc="Editorial layout for a self-published photo zine, printed in a run of 50.">
      <div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg></div>
    </div>

    <div class="masonry-item h1 reveal" data-lightbox-title="Overlook UI Kit" data-lightbox-desc="Component library and design tokens built for the Overlook dashboard product.">
      <div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg></div>
    </div>

    <div class="masonry-item h3 reveal" data-lightbox-title="Low Tide Poster Series" data-lightbox-desc="A set of promotional posters for the in-progress game Low Tide.">
      <div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg></div>
    </div>

    <div class="masonry-item h2 reveal" data-lightbox-title="Fieldnotes App Icon Set" data-lightbox-desc="Icon system designed for the Fieldnotes journaling app.">
      <div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg></div>
    </div>

    <div class="masonry-item h4 reveal" data-lightbox-title="Corner Cafe Menu" data-lightbox-desc="Print menu redesign for a local coffee shop, hand-lettered accents.">
      <div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg></div>
    </div>

  </section>

</main>

<div class="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 2l14 14M16 2L2 16" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>
  <div class="lightbox-content">
    <div class="lightbox-image">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
    </div>
    <div class="lightbox-info">
      <h3></h3>
      <p></p>
    </div>
  </div>
</div>
